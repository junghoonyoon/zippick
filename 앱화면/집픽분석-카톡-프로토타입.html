<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>집픽 분석 보기 — 카톡 분석 리포트 프로토타입</title>
<style>
  :root{
    --ink:#191f28; --sub:#4e5968; --dim:#8b95a1; --line:#e5e8eb;
    --blue:#3182f6; --blue-dark:#1b64da; --blue-soft:#eaf2fe;
    --green:#0f9d58; --green-soft:#e7f6ee;
    --amber:#b4690e; --amber-soft:#fdf2e0;
    --red:#e5432e;
    --chat-bg:#9bb0c4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:#dfe3e8;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; padding:24px 16px 60px;
  }
  .phone{
    width:min(420px,100%); background:var(--chat-bg);
    border-radius:28px; overflow:hidden;
    box-shadow:0 18px 50px rgba(25,31,40,.22);
    display:flex; flex-direction:column; height:min(880px,calc(100vh - 84px)); min-height:640px;
  }

  /* ── header ─────────────────────────────── */
  .hd{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:14px 14px 12px; background:var(--chat-bg);
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .hd-back{border:0; background:transparent; padding:0 2px; font-size:20px; color:#fff; cursor:pointer; line-height:1}
  .hd-av{
    flex:none; width:36px; height:36px; border-radius:12px; background:var(--blue);
    display:grid; place-items:center; color:#fff; font-size:15px; font-weight:900;
  }
  .hd-txt{flex:1; min-width:0}
  .hd-name{font-size:15px; font-weight:900; color:#fff; line-height:1.3}
  .hd-desc{font-size:11.5px; font-weight:700; color:rgba(255,255,255,.78); line-height:1.4; margin-top:1px}
  .hd-replay{
    flex:none; border:0; border-radius:999px; padding:6px 11px; cursor:pointer;
    background:rgba(255,255,255,.28); color:#fff; font-family:inherit;
    font-size:11.5px; font-weight:850;
  }

  /* ── chat scroll ────────────────────────── */
  .chat{flex:1; overflow-y:auto; padding:14px 14px 20px; scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:0}
  .daytag{
    text-align:center; margin:2px 0 14px;
  }
  .daytag span{
    display:inline-block; border-radius:999px; padding:4px 12px;
    background:rgba(0,0,0,.18); color:#fff; font-size:11.5px; font-weight:800;
  }

  .row{display:flex; gap:8px; margin-bottom:10px; align-items:flex-end}
  .row.hidden{display:none}
  .row .av{
    flex:none; width:34px; height:34px; border-radius:12px; background:var(--blue);
    display:grid; place-items:center; color:#fff; font-size:14px; font-weight:900;
    align-self:flex-start;
  }
  .row .av.ghost{visibility:hidden}
  .stack{display:flex; align-items:flex-end; gap:5px; max-width:calc(100% - 44px)}
  .time{flex:none; font-size:10.5px; font-weight:700; color:rgba(255,255,255,.85); padding-bottom:2px}

  .bub{
    position:relative; background:#fff; border-radius:4px 16px 16px 16px;
    padding:11px 14px; font-size:14.5px; font-weight:650; line-height:1.65;
    color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.07);
    animation:pop .26s cubic-bezier(.2,.8,.3,1);
    word-break:keep-all;
  }
  .bub.cont{border-radius:16px}
  .bub b{font-weight:900}
  .bub .hl{background:linear-gradient(transparent 58%, #ffe08a 58%); font-weight:900}
  @keyframes pop{from{opacity:0; transform:translateY(8px) scale(.97)} to{opacity:1; transform:none}}

  /* typing */
  .typing{
    background:#fff; border-radius:4px 16px 16px 16px; padding:14px 16px;
    display:inline-flex; gap:4px; box-shadow:0 1px 2px rgba(0,0,0,.07);
  }
  .typing i{width:6px; height:6px; border-radius:50%; background:#c4ccd6; animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.35; transform:translateY(0)} 30%{opacity:1; transform:translateY(-3px)}}

  /* ── verdict card ───────────────────────── */
  .card{
    background:#fff; border-radius:4px 18px 18px 18px; padding:16px 16px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,.07); animation:pop .26s cubic-bezier(.2,.8,.3,1);
    width:100%;
  }
  .card.cont{border-radius:18px}
  .vd-badge{
    display:inline-flex; align-items:center; gap:6px; border-radius:999px;
    padding:6px 13px 6px 11px; background:var(--green-soft); color:#0b7a45;
    font-size:13.5px; font-weight:900; letter-spacing:-.2px;
  }
  .vd-dot{width:7px; height:7px; border-radius:50%; background:var(--green)}
  .vd-h{margin:11px 0 0; font-size:17px; font-weight:900; line-height:1.5; letter-spacing:-.3px; word-break:keep-all}
  .vd-p{margin:7px 0 0; font-size:13.5px; font-weight:680; line-height:1.62; color:var(--sub); word-break:keep-all}

  .matrix{margin-top:14px; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .mx-top{display:grid; grid-template-columns:52px 1fr 1fr 1fr; background:#f7f9fb}
  .mx-top div{padding:6px 4px; font-size:9.5px; font-weight:850; color:var(--dim); text-align:center; line-height:1.3}
  .mx-row{display:grid; grid-template-columns:52px 1fr 1fr 1fr; border-top:1px solid var(--line)}
  .mx-row .lb{
    display:grid; place-items:center; padding:8px 2px; background:#f7f9fb;
    font-size:9.5px; font-weight:850; color:var(--dim); text-align:center; line-height:1.3;
  }
  .cell{
    display:grid; place-items:center; padding:9px 2px; border-left:1px solid var(--line);
    font-size:10.5px; font-weight:800; color:#b0b8c1; text-align:center; line-height:1.3;
  }
  .cell.on{background:var(--green-soft); color:#0b7a45; font-weight:900; position:relative}
  .cell.on::after{
    content:"여기"; position:absolute; top:-1px; right:-1px; background:var(--green); color:#fff;
    font-size:8px; font-weight:900; padding:1px 4px; border-radius:0 0 0 6px;
  }
  .mx-note{padding:9px 12px; border-top:1px solid var(--line); background:#fbfcfd;
    font-size:11px; font-weight:700; color:var(--dim); line-height:1.55; word-break:keep-all}

  /* ── score bars ─────────────────────────── */
  .sc-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px}
  .sc-title{font-size:14.5px; font-weight:900; letter-spacing:-.2px}
  .sc-num{font-size:13px; font-weight:900; color:var(--blue)}
  .bar{margin-bottom:11px}
  .bar:last-child{margin-bottom:0}
  .bar-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px}
  .bar-lb{font-size:12.5px; font-weight:800; color:var(--ink)}
  .bar-vl{font-size:11.5px; font-weight:850; color:var(--dim); white-space:nowrap}
  .bar-tr{height:7px; border-radius:99px; background:#eef1f4; overflow:hidden}
  .bar-fl{height:100%; border-radius:99px; background:var(--blue); width:0; transition:width .7s cubic-bezier(.2,.8,.3,1)}
  .bar-fl.g{background:var(--green)}
  .bar-fl.a{background:#e8a13a}
  .bar-rs{margin-top:5px; font-size:11.5px; font-weight:700; color:var(--dim); line-height:1.55; word-break:keep-all}

  .cap{
    margin-top:13px; border-radius:10px; padding:10px 12px; background:var(--blue-soft);
    font-size:12px; font-weight:750; color:#1b4fa8; line-height:1.6; word-break:keep-all;
  }
  .cap b{font-weight:900}

  /* weakness */
  .bub.warn{background:#fffaf2}
  .warn-tag{
    display:inline-block; border-radius:6px; padding:3px 8px; margin-bottom:8px;
    background:var(--amber-soft); color:var(--amber); font-size:11.5px; font-weight:900;
  }

  /* action */
  .act{counter-reset:a; margin:10px 0 0; padding:0; list-style:none}
  .act li{
    position:relative; padding:0 0 0 27px; margin-bottom:11px;
    font-size:14px; font-weight:700; line-height:1.62; word-break:keep-all;
  }
  .act li:last-child{margin-bottom:0}
  .act li::before{
    counter-increment:a; content:counter(a);
    position:absolute; left:0; top:2px; width:19px; height:19px; border-radius:6px;
    background:var(--ink); color:#fff; font-size:11px; font-weight:900;
    display:grid; place-items:center;
  }
  .act b{font-weight:900}
  .act .hl{background:linear-gradient(transparent 58%, #ffe08a 58%); font-weight:900}

  .disc{
    margin:2px 0 0; padding:10px 12px; border-radius:12px; background:rgba(0,0,0,.13);
    font-size:11px; font-weight:700; color:rgba(255,255,255,.92); line-height:1.6; word-break:keep-all;
  }

  /* ── bottom cta ─────────────────────────── */
  .cta{
    flex:none; display:flex; gap:8px; padding:12px 14px 16px;
    background:#fff; border-top:1px solid var(--line);
  }
  .cta button{
    flex:1; height:50px; border:0; border-radius:14px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:900; letter-spacing:-.2px;
  }
  .cta .primary{background:var(--blue); color:#fff}
  .cta .ghost{flex:0 0 108px; background:#f2f4f6; color:var(--sub)}
</style>
</head>
<body>

<div class="phone">
  <div class="hd">
    <button class="hd-back" aria-label="뒤로">‹</button>
    <div class="hd-av">집</div>
    <div class="hd-txt">
      <div class="hd-name">집픽 분석원</div>
      <div class="hd-desc">국토부 실거래 데이터로만 말합니다</div>
    </div>
    <button class="hd-replay" id="replay">다시 보기</button>
  </div>

  <div class="chat" id="chat">
    <div class="daytag"><span>2026년 8월 3일 월요일</span></div>
  </div>

  <div class="cta">
    <button class="ghost">비교 담기</button>
    <button class="primary">네이버 매물 보기</button>
  </div>
</div>

<script>
const AVATAR = '집';

/* 실제 파이프라인 값 구조 그대로 (locationScore.parts / signals.breakdown) */

  { delay: 1400, time:'오전 9:15', html:
    `그다음이 <b>시장 흐름</b>인데,<br>여기가 이번에 눈에 띄었습니다.` },

const chat = document.getElementById('chat');

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function toBottom(){ chat.scrollTop = chat.scrollHeight; }

function typingRow(){
  return el(`<div class="row"><div class="av">${AVATAR}</div>
    <div class="typing"><i></i><i></i><i></i></div></div>`);
}

function buildRow(m){
  if(m.type === 'disc'){
    return el(`<div class="row"><div class="av ghost"></div><div class="stack" style="max-width:100%">
      <div class="disc">${m.html}</div></div></div>`);
  }
  const av = m.cont ? `<div class="av ghost"></div>` : `<div class="av">${AVATAR}</div>`;
  const contCls = m.cont ? ' cont' : '';
  const body = (m.type === 'card')
    ? `<div class="card${contCls}">${m.html}</div>`
    : `<div class="bub${contCls}${m.type==='warn'?' warn':''}">${m.html}</div>`;
  const stackWidth = (m.type === 'card') ? ' style="max-width:calc(100% - 42px); width:100%"' : '';
  return el(`<div class="row">${av}<div class="stack"${stackWidth}>${body}
    <span class="time">${m.time || ''}</span></div></div>`);
}

let running = false;
async function play(){
  if(running) return; running = true;
  chat.querySelectorAll('.row').forEach(n => n.remove());
  const wait = ms => new Promise(r => setTimeout(r, ms));

  for(const m of MSGS){
    const t = typingRow();
    chat.appendChild(t); toBottom();
    await wait(Math.min(m.delay, 1400) * 0.55);
    t.remove();

    const row = buildRow(m);
    chat.appendChild(row); toBottom();

    if(m.bars){
      requestAnimationFrame(() => {
        row.querySelectorAll('.bar-fl').forEach((b,i) => {
          setTimeout(() => b.style.width = b.dataset.w + '%', 60 + i*90);
        });
      });
    }
    await wait(m.delay * 0.45);
    toBottom();
  }
  running = false;
}

document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
